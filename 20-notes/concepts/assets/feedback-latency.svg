<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%" style="background: #18191c; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 12px; border: 1px solid #333;">
  <!-- Header -->
  <rect x="0" y="0" width="960" height="48" fill="#22252a" rx="12" />
  <text x="24" y="30" fill="#38bdf8" font-size="15" font-weight="700" letter-spacing="1">HCI COGNITIVE LATENCY LIMITS &amp; FEEDBACK ARCHITECTURE</text>
  <text x="800" y="30" fill="#888" font-size="12">MILLER (1968) · NIELSEN</text>

  <!-- Timeline Baseline Bar -->
  <rect x="50" y="140" width="860" height="8" rx="4" fill="#334155" />

  <!-- Point 1: 0.1s (100ms) -->
  <circle cx="150" cy="144" r="14" fill="#38bdf8" stroke="#0284c7" stroke-width="3"/>
  <rect x="65" y="68" width="170" height="52" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
  <text x="150" y="88" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">&lt; 0.1s (100 ms)</text>
  <text x="150" y="106" fill="#e2e8f0" font-size="11" text-anchor="middle">Instant / Direct Feel</text>
  <text x="150" y="180" fill="#94a3b8" font-size="11" text-anchor="middle">Keypress click, slider drag</text>
  <text x="150" y="196" fill="#64748b" font-size="10" text-anchor="middle">Feels physically instantaneous</text>

  <!-- Point 2: 1.0s -->
  <circle cx="480" cy="144" r="14" fill="#10b981" stroke="#059669" stroke-width="3"/>
  <rect x="395" y="68" width="170" height="52" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
  <text x="480" y="88" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">&lt; 1.0 Second</text>
  <text x="480" y="106" fill="#e2e8f0" font-size="11" text-anchor="middle">Unbroken Train of Thought</text>
  <text x="480" y="180" fill="#94a3b8" font-size="11" text-anchor="middle">Page navigation, simple search</text>
  <text x="480" y="196" fill="#64748b" font-size="10" text-anchor="middle">User notices lag, but stays focused</text>

  <!-- Point 3: 10s -->
  <circle cx="810" cy="144" r="14" fill="#ef4444" stroke="#dc2626" stroke-width="3"/>
  <rect x="725" y="68" width="170" height="52" rx="6" fill="#0f172a" stroke="#dc2626" stroke-width="1.5"/>
  <text x="810" y="88" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">&gt; 10 Seconds</text>
  <text x="810" y="106" fill="#e2e8f0" font-size="11" text-anchor="middle">Attention Lost / Switching</text>
  <text x="810" y="180" fill="#94a3b8" font-size="11" text-anchor="middle">Large file upload, batch render</text>
  <text x="810" y="196" fill="#ef4444" font-size="10" font-weight="600" text-anchor="middle">Percent bar or background notify</text>

  <!-- Bottom Comparison Card: Feedforward vs Feedback -->
  <g transform="translate(60, 225)">
    <rect width="400" height="70" rx="8" fill="#1e2029" stroke="#6366f1" stroke-width="1"/>
    <text x="18" y="26" fill="#818cf8" font-size="12" font-weight="700">FEEDFORWARD (Pre-Action)</text>
    <text x="18" y="46" fill="#cbd5e1" font-size="11">Answers: "What will happen if I click/touch this?"</text>
    <text x="18" y="60" fill="#94a3b8" font-size="10">Hover glow · Snap-to lines · Ghost drop targets</text>
  </g>

  <g transform="translate(500, 225)">
    <rect width="400" height="70" rx="8" fill="#1e2029" stroke="#10b981" stroke-width="1"/>
    <text x="18" y="26" fill="#34d399" font-size="12" font-weight="700">FEEDBACK (Post-Action)</text>
    <text x="18" y="46" fill="#cbd5e1" font-size="11">Answers: "Did the action work, and what state am I in?"</text>
    <text x="18" y="60" fill="#94a3b8" font-size="10">Tactile haptic click · Spinner · Success banner</text>
  </g>
</svg>
