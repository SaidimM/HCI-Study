<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%" style="background: #18191c; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 12px; border: 1px solid #333;">
  <!-- Header -->
  <rect x="0" y="0" width="960" height="48" fill="#22252a" rx="12" />
  <text x="24" y="30" fill="#a78bfa" font-size="15" font-weight="700" letter-spacing="1">DON NORMAN'S TRIAD: DESIGN MODEL · SYSTEM IMAGE · USER MODEL</text>
  <text x="820" y="30" fill="#888" font-size="12">DOET CH. 1 &amp; 2</text>

  <!-- Left: Designer Box -->
  <g transform="translate(60, 80)">
    <rect width="240" height="240" rx="10" fill="#1e2029" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="16" y="16" width="208" height="32" rx="6" fill="#2e1065"/>
    <text x="120" y="37" fill="#c4b5fd" font-size="13" font-weight="700" text-anchor="middle">DESIGNER</text>
    
    <text x="120" y="75" fill="#f5f3ff" font-size="14" font-weight="600" text-anchor="middle">Design Model</text>
    <text x="120" y="98" fill="#a78bfa" font-size="11" text-anchor="middle">(The Mental Model of Creator)</text>
    
    <rect x="20" y="115" width="200" height="95" rx="6" fill="#14151b"/>
    <text x="30" y="135" fill="#94a3b8" font-size="11">• How the system *actually* works</text>
    <text x="30" y="155" fill="#94a3b8" font-size="11">• Circuit schematics, backend schemas</text>
    <text x="30" y="175" fill="#94a3b8" font-size="11">• Assumes full engineering logic</text>
    <text x="30" y="195" fill="#ef4444" font-size="10" font-weight="600">⚠ Cannot talk to User directly!</text>
  </g>

  <!-- Center Arrow from Designer to System Image -->
  <path d="M 300 200 L 370 200" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="370,195 382,200 370,205" fill="#8b5cf6"/>
  <text x="340" y="185" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">Expresses</text>
  <text x="340" y="222" fill="#64748b" font-size="10" text-anchor="middle">via Build</text>

  <!-- Center: System Image Box -->
  <g transform="translate(385, 60)">
    <rect width="210" height="270" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="16" y="16" width="178" height="32" rx="6" fill="#0c4a6e"/>
    <text x="105" y="37" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">SYSTEM IMAGE</text>
    
    <text x="105" y="75" fill="#f0f9ff" font-size="13" font-weight="600" text-anchor="middle">The Physical Reality</text>
    <text x="105" y="94" fill="#38bdf8" font-size="11" text-anchor="middle">Only Common Channel</text>
    
    <rect x="15" y="108" width="180" height="135" rx="6" fill="#0f172a"/>
    <text x="25" y="130" fill="#94a3b8" font-size="11">1. Physical device / body</text>
    <text x="25" y="150" fill="#94a3b8" font-size="11">2. Touchscreen UI / icons</text>
    <text x="25" y="170" fill="#94a3b8" font-size="11">3. Immediate feedback</text>
    <text x="25" y="190" fill="#94a3b8" font-size="11">4. Error messages</text>
    <text x="25" y="210" fill="#94a3b8" font-size="11">5. Manuals, labels, ads</text>
    <text x="25" y="230" fill="#38bdf8" font-size="10" font-weight="600">The entire visible truth</text>
  </g>

  <!-- Center Arrow from System Image to User -->
  <path d="M 595 200 L 665 200" stroke="#10b981" stroke-width="3"/>
  <polygon points="665,195 677,200 665,205" fill="#10b981"/>
  <text x="635" y="185" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">Perceives</text>
  <text x="635" y="222" fill="#64748b" font-size="10" text-anchor="middle">&amp; Interprets</text>

  <!-- Right: User Box -->
  <g transform="translate(680, 80)">
    <rect width="240" height="240" rx="10" fill="#1c2420" stroke="#10b981" stroke-width="2"/>
    <rect x="16" y="16" width="208" height="32" rx="6" fill="#064e3b"/>
    <text x="120" y="37" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">USER</text>
    
    <text x="120" y="75" fill="#ecfdf5" font-size="14" font-weight="600" text-anchor="middle">User's Model</text>
    <text x="120" y="98" fill="#34d399" font-size="11" text-anchor="middle">(The Mental Model of Learner)</text>
    
    <rect x="20" y="115" width="200" height="95" rx="6" fill="#0f1713"/>
    <text x="30" y="135" fill="#94a3b8" font-size="11">• Formed *only* from System Image</text>
    <text x="30" y="155" fill="#94a3b8" font-size="11">• Heavily influenced by past habits</text>
    <text x="30" y="175" fill="#94a3b8" font-size="11">• If image is faulty → MISTAKE</text>
    <text x="30" y="195" fill="#fbbf24" font-size="10" font-weight="600">★ Directs all execution &amp; evaluation</text>
  </g>
</svg>
