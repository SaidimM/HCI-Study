<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%" style="background: #18191c; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 12px; border: 1px solid #333;">
  <!-- Header Banner -->
  <rect x="0" y="0" width="960" height="48" fill="#22252a" rx="12" />
  <text x="24" y="30" fill="#90caf9" font-size="15" font-weight="700" letter-spacing="1">DON NORMAN'S FOUR DIMENSIONS OF A SIGNIFIER</text>
  <text x="830" y="30" fill="#888" font-size="12">CS147 · CORE TAXONOMY</text>

  <!-- Card 1: WHAT -->
  <g transform="translate(24, 68)">
    <rect width="210" height="230" rx="8" fill="#1f232a" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="12" y="12" width="40" height="24" rx="4" fill="#1e3a5f"/>
    <text x="32" y="28" fill="#60a5fa" font-size="11" font-weight="700" text-anchor="middle">01</text>
    <text x="60" y="29" fill="#93c5fd" font-size="14" font-weight="700">WHAT IS IT?</text>
    <text x="12" y="60" fill="#e2e8f0" font-size="13" font-weight="600">Action Possibility</text>
    <text x="12" y="80" fill="#94a3b8" font-size="11" width="186">Identifies the category of interaction that can occur.</text>
    
    <!-- Illustration: Trash Foot Pedal -->
    <rect x="25" y="105" width="160" height="75" rx="6" fill="#15181e" stroke="#2d3748"/>
    <!-- Trash can base & pedal -->
    <rect x="65" y="115" width="80" height="40" rx="3" fill="#334155"/>
    <rect x="80" y="155" width="50" height="12" rx="2" fill="#60a5fa"/>
    <line x1="85" y1="158" x2="125" y2="158" stroke="#1e3a5f" stroke-width="1.5"/>
    <line x1="85" y1="162" x2="125" y2="162" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="105" y="138" fill="#94a3b8" font-size="10" text-anchor="middle">Trash Can</text>
    <text x="105" y="196" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle">Foot Step Pedal</text>
    <text x="105" y="215" fill="#64748b" font-size="10" text-anchor="middle">"Step here to open lid"</text>
  </g>

  <!-- Card 2: WHERE -->
  <g transform="translate(258, 68)">
    <rect width="210" height="230" rx="8" fill="#1f232a" stroke="#10b981" stroke-width="1.5"/>
    <rect x="12" y="12" width="40" height="24" rx="4" fill="#064e3b"/>
    <text x="32" y="28" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">02</text>
    <text x="60" y="29" fill="#6ee7b7" font-size="14" font-weight="700">WHERE TO ACT?</text>
    <text x="12" y="60" fill="#e2e8f0" font-size="13" font-weight="600">Spatial Touch Target</text>
    <text x="12" y="80" fill="#94a3b8" font-size="11">Pinpoints the exact physical or digital locus of action.</text>

    <!-- Illustration: Toilet Tank Dual Flush -->
    <rect x="25" y="105" width="160" height="75" rx="6" fill="#15181e" stroke="#2d3748"/>
    <circle cx="105" cy="142" r="26" fill="#334155" stroke="#475569" stroke-width="2"/>
    <path d="M 105 116 A 26 26 0 0 1 105 168 Z" fill="#34d399" opacity="0.9"/>
    <circle cx="105" cy="142" r="26" fill="none" stroke="#6ee7b7" stroke-width="1"/>
    <line x1="105" y1="116" x2="105" y2="168" stroke="#15181e" stroke-width="2"/>
    <text x="105" y="196" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">Dual-Flush Buttons</text>
    <text x="105" y="215" fill="#64748b" font-size="10" text-anchor="middle">"Press left: half / right: full"</text>
  </g>

  <!-- Card 3: HOW -->
  <g transform="translate(492, 68)">
    <rect width="210" height="230" rx="8" fill="#1f232a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="12" y="12" width="40" height="24" rx="4" fill="#78350f"/>
    <text x="32" y="28" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">03</text>
    <text x="60" y="29" fill="#fde68a" font-size="14" font-weight="700">HOW TO DO IT?</text>
    <text x="12" y="60" fill="#e2e8f0" font-size="13" font-weight="600">Kinematic / Gesture</text>
    <text x="12" y="80" fill="#94a3b8" font-size="11">Guides the direction, force, and axis of motor motion.</text>

    <!-- Illustration: BottomSheet Grabber -->
    <rect x="25" y="105" width="160" height="75" rx="6" fill="#15181e" stroke="#2d3748"/>
    <rect x="35" y="130" width="140" height="50" rx="8" fill="#334155"/>
    <!-- Grabber pill -->
    <rect x="85" y="138" width="40" height="5" rx="2.5" fill="#fbbf24"/>
    <!-- Motion arrows -->
    <path d="M 105 125 L 100 130 L 110 130 Z" fill="#fbbf24"/>
    <path d="M 105 152 L 100 147 L 110 147 Z" fill="#fbbf24"/>
    <text x="105" y="196" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">BottomSheet Pill</text>
    <text x="105" y="215" fill="#64748b" font-size="10" text-anchor="middle">"Slide vertical axis (up/down)"</text>
  </g>

  <!-- Card 4: STATE -->
  <g transform="translate(726, 68)">
    <rect width="210" height="230" rx="8" fill="#1f232a" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="12" y="12" width="40" height="24" rx="4" fill="#7f1d1d"/>
    <text x="32" y="28" fill="#f87171" font-size="11" font-weight="700" text-anchor="middle">04</text>
    <text x="60" y="29" fill="#fca5a5" font-size="14" font-weight="700">SYSTEM STATE</text>
    <text x="12" y="60" fill="#e2e8f0" font-size="13" font-weight="600">Status & Readiness</text>
    <text x="12" y="80" fill="#94a3b8" font-size="11">Communicates internal system mode before & after actions.</text>

    <!-- Illustration: Badge counter & Status LED -->
    <rect x="25" y="105" width="160" height="75" rx="6" fill="#15181e" stroke="#2d3748"/>
    <!-- App icon -->
    <rect x="65" y="122" width="42" height="42" rx="10" fill="#3b82f6"/>
    <circle cx="105" cy="122" r="10" fill="#ef4444" stroke="#15181e" stroke-width="2"/>
    <text x="105" y="126" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">3</text>
    <!-- Kettle status LED -->
    <circle cx="138" cy="143" r="6" fill="#22c55e"/>
    <circle cx="138" cy="143" r="10" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
    <text x="105" y="196" fill="#f87171" font-size="11" font-weight="600" text-anchor="middle">Badges & Status LEDs</text>
    <text x="105" y="215" fill="#64748b" font-size="10" text-anchor="middle">"3 unread items · System Ready"</text>
  </g>
</svg>
