<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="25%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="playerFace" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="85%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    /* Spin animation for the CD */
    .spinning-cd {
      animation: cdRotate 2.5s linear infinite;
      transform-origin: 440px 240px;
    }
    @keyframes cdRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Pull cord pull and release animation */
    .cord-group {
      animation: tugString 4s ease-in-out infinite;
      transform-origin: 440px 325px;
    }
    @keyframes tugString {
      0%, 10%, 100% { transform: translateY(0); }
      5% { transform: translateY(28px); }
      7% { transform: translateY(0); }
    }

    /* Sound waves rippling outward */
    .sound-wave-1 {
      animation: waveExpand 2.5s ease-out infinite;
      transform-origin: 440px 240px;
    }
    .sound-wave-2 {
      animation: waveExpand 2.5s ease-out infinite 1.25s;
      transform-origin: 440px 240px;
    }
    @keyframes waveExpand {
      0% { r: 125px; opacity: 0.8; stroke-width: 2px; }
      100% { r: 210px; opacity: 0; stroke-width: 0.5px; }
    }

    /* Usability Warning pulse */
    .flaw-pulse {
      animation: flawWarning 2s ease-in-out infinite;
    }
    @keyframes flawWarning {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
  </style>

  <!-- Title & Header Banner -->
  <rect x="25" y="20" width="830" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="45" y="45" fill="#f8fafc" font-size="17" font-weight="700">Naoto Fukasawa's Wall-Mounted CD Player (Muji, 1999) — Usability Tradeoffs</text>
  <text x="45" y="64" fill="#94a3b8" font-size="12">Poetic "Without Thought" Metaphor vs. Severe Gulfs of Execution and Evaluation</text>

  <!-- Sound Waves (Simulating music breeze) -->
  <circle cx="440" cy="240" r="130" fill="none" stroke="#38bdf8" class="sound-wave-1"/>
  <circle cx="440" cy="240" r="130" fill="none" stroke="#818cf8" class="sound-wave-2"/>

  <!-- Wall mounting shadow & plate -->
  <rect x="330" y="130" width="220" height="220" rx="14" fill="#000" opacity="0.4" filter="url(#softShadow)"/>

  <!-- Muji CD Player Body (Square with rounded corners) -->
  <rect x="335" y="135" width="210" height="210" rx="12" fill="url(#playerFace)" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Hidden Top Buttons (On the top rim - normally invisible from front!) -->
  <g id="top-controls">
    <!-- Volume - -->
    <rect x="375" y="128" width="16" height="7" rx="2" fill="#94a3b8"/>
    <!-- Volume + -->
    <rect x="398" y="128" width="16" height="7" rx="2" fill="#94a3b8"/>
    <!-- Skip Prev -->
    <rect x="465" y="128" width="16" height="7" rx="2" fill="#94a3b8"/>
    <!-- Skip Next -->
    <rect x="488" y="128" width="16" height="7" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Speaker Perforations (Discreet micro-perforations around disc well) -->
  <circle cx="440" cy="240" r="98" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="440" cy="240" r="92" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 3"/>
  <circle cx="440" cy="240" r="86" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5"/>

  <!-- Exposed Spinning CD (Animated) -->
  <g class="spinning-cd">
    <!-- Polycarbonate Disc -->
    <circle cx="440" cy="240" r="76" fill="url(#discGrad)" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Data Track Grooves -->
    <circle cx="440" cy="240" r="66" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.8"/>
    <circle cx="440" cy="240" r="52" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="0.8"/>
    <circle cx="440" cy="240" r="38" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.8"/>
    <!-- Holographic Rainbow Reflections -->
    <path d="M 440 240 L 495 185 A 76 76 0 0 1 515 240 Z" fill="#ffffff" opacity="0.25"/>
    <path d="M 440 240 L 385 295 A 76 76 0 0 1 365 240 Z" fill="#ffffff" opacity="0.25"/>
    <!-- Center Clamping Ring & Spindle Hole -->
    <circle cx="440" cy="240" r="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="440" cy="240" r="8" fill="#1e293b"/>
    <!-- Disc Label Text (Spinning) -->
    <text x="440" y="226" fill="#475569" font-size="5" font-weight="bold" text-anchor="middle">MUJI AUDIO · COMPACT DISC</text>
  </g>

  <!-- Pull Cord Switch (Ventilation Fan Metaphor) -->
  <g class="cord-group">
    <!-- The cord line -->
    <line x1="440" y1="345" x2="440" y2="480" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Hanging pull handle -->
    <rect x="435" y="480" width="10" height="26" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Hand tug indicator -->
    <path d="M 440 515 L 440 535 M 434 528 L 440 536 L 446 528" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="440" y="552" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">TUG TO PLAY / STOP</text>
    <text x="440" y="566" fill="#94a3b8" font-size="10" text-anchor="middle">Metaphor: Kitchen Vent Fan</text>
  </g>

  <!-- USABILITY CALLOUT 1: Hidden Buttons (Top Edge) -->
  <g class="flaw-pulse" transform="translate(60, 110)">
    <rect width="230" height="95" rx="8" fill="#1e1b4b" stroke="#ef4444" stroke-width="1.8"/>
    <circle cx="20" cy="22" r="10" fill="#ef4444"/>
    <text x="20" y="27" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">?</text>
    <text x="38" y="26" fill="#f87171" font-size="12" font-weight="bold">Where are the controls?</text>
    <text x="14" y="48" fill="#cbd5e1" font-size="11">Volume &amp; track buttons are tiny nubs</text>
    <text x="14" y="64" fill="#fca5a5" font-size="11" font-weight="bold">hidden on the top rim.</text>
    <text x="14" y="80" fill="#94a3b8" font-size="10.5">Invisible at eye level; requires blind guessing.</text>
    <!-- Connector line to top edge -->
    <path d="M 230 45 Q 310 45 375 125" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- USABILITY CALLOUT 2: Hidden Speaker -->
  <g class="flaw-pulse" transform="translate(60, 245)">
    <rect width="230" height="85" rx="8" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.8"/>
    <circle cx="20" cy="22" r="10" fill="#f59e0b"/>
    <text x="20" y="27" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">?</text>
    <text x="38" y="26" fill="#fbbf24" font-size="12" font-weight="bold">Where is the speaker?</text>
    <text x="14" y="48" fill="#cbd5e1" font-size="11">Integrated stealthily behind plastic rim.</text>
    <text x="14" y="64" fill="#cbd5e1" font-size="11"><tspan fill="#fde68a" font-weight="bold">Missing signifiers:</tspan> Users mistake it</text>
    <text x="14" y="78" fill="#cbd5e1" font-size="11">for a bare disc mount, expecting external boxes.</text>
    <!-- Connector line to body -->
    <path d="M 230 45 Q 290 45 340 220" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- USABILITY CALLOUT 3: No Display / Exposed Disc -->
  <g class="flaw-pulse" transform="translate(590, 150)">
    <rect width="245" height="115" rx="8" fill="#1e1b4b" stroke="#ef4444" stroke-width="1.8"/>
    <circle cx="20" cy="22" r="10" fill="#ef4444"/>
    <text x="20" y="27" fill="#fff" font-size="13" font-weight="bold" text-anchor="middle">!</text>
    <text x="38" y="26" fill="#f87171" font-size="12" font-weight="bold">Gulf of Evaluation &amp; Physics</text>
    <text x="14" y="48" fill="#cbd5e1" font-size="11"><tspan fill="#fca5a5" font-weight="bold">• No LCD / Status Display:</tspan></text>
    <text x="24" y="64" fill="#cbd5e1" font-size="11">Which track is playing? Time remaining?</text>
    <text x="14" y="82" fill="#cbd5e1" font-size="11"><tspan fill="#fca5a5" font-weight="bold">• Exposed Spinning Disc (500 RPM):</tspan></text>
    <text x="24" y="98" fill="#cbd5e1" font-size="11">Zero dust cover; toddler &amp; pet hazard.</text>
    <!-- Connector line to center CD -->
    <path d="M 0 55 Q -80 55 -90 190" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Bottom Synthesis Banner -->
  <rect x="60" y="580" width="760" height="30" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="440" y="600" fill="#94a3b8" font-size="11" text-anchor="middle">
    Norman's Levels: <tspan fill="#38bdf8" font-weight="bold">Visceral = 10/10</tspan> (Zen serenity) · <tspan fill="#a855f7" font-weight="bold">Reflective = 9/10</tspan> (MoMA Icon) · <tspan fill="#ef4444" font-weight="bold">Behavioral = 3/10</tspan> (Severe control gulfs)
  </text>
</svg>
